<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tournament Manager</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#1f7a4d;--bd:#e2e5e9;--hl:#e8f5ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1f2428;--tx:#eceff2;--mu:#9aa3ad;--ac:#3fb67c;--bd:#323941;--hl:#1e3a2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:70px}
h1{font-size:18px;margin:0;padding:12px 14px}
h2{font-size:14px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:10px;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 4px;font-size:13px;font-weight:600}
nav button.on{color:var(--ac);box-shadow:inset 0 2px var(--ac)}
section{display:none}section.on{display:block}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-size:12px}
td:nth-child(2),th:nth-child(2){text-align:left;width:34%}
tr.top td{background:var(--hl)}
td.pts{font-weight:700}
input,select,button.b{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
input[type=text],select{width:100%}
input[type=number]{width:52px;text-align:center}
button.b{background:var(--ac);color:#fff;border:0;font-weight:600;padding:9px 12px}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row>*{min-width:0}
.fx{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--bd)}
.fx .n{color:var(--mu);width:22px;font-size:12px}
.fx .t{flex:1;font-size:14px}.fx .t.r{text-align:right}
.tag{font-size:10px;background:var(--hl);color:var(--ac);border-radius:6px;padding:1px 5px;margin-left:4px}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:5px;font-size:10px;padding:1px 6px}
.mu{color:var(--mu);font-size:13px}
.pm{width:34px;padding:6px 0}
</style></head><body>
<h1>🏆 Tournament Manager</h1>

<section id="s0" class="on"><div id="tabs"></div></section>

<section id="s1"><div class="card"><h2>Fixtures (in play order)</h2><div id="fx"></div></div></section>

<section id="s2"><div class="card"><h2>Top scorers</h2><div id="sc"></div>
<div class="row"><input type="text" id="sn" placeholder="Player name"><select id="st" style="width:45%"></select></div>
<button class="b" onclick="addSc()">Add player</button></div></section>

<section id="s3">
<div class="card"><h2>Teams</h2><div id="teams"></div></div>
<div class="card"><h2>Lottery matches</h2><div class="mu">Each Group A team plays one Group B team. Change freely.</div><div id="lot"></div>
<div class="row"><button class="b g" onclick="shuf()">🎲 Shuffle draw</button></div>
<div class="row"><label><input type="checkbox" id="cl" onchange="S.cl=this.checked;save();draw()"> Count lottery matches in group table</label></div></div>
<div class="card"><h2>Points</h2><div class="row">Win <input type="number" id="pw"> Draw <input type="number" id="pd"> Loss <input type="number" id="pl"></div></div>
<div class="card"><button class="b" onclick="gen()">Generate fixtures</button>
<div class="mu" style="margin-top:6px">Rebuilds the fixture list and clears all scores.</div>
<div class="row"><button class="b g" onclick="rst()">Reset everything</button></div></div>
</section>

<nav id="nav"></nav>
<script>
const K='ptool1',G=['Group A','Group B'];
const def=()=>({t:['Team A1','Team A2','Team A3','Team B1','Team B2','Team B3'],w:3,d:1,l:0,lot:[3,4,5],cl:true,fx:[],sc:[]});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S=def();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const grp=i=>i<3?0:1;
let view=0;
const names=['Tables','Fixtures','Scorers','Setup'];
function nav(){$('nav').innerHTML=names.map((n,i)=>`<button class="${i==view?'on':''}" onclick="view=${i};draw()">${n}</button>`).join('');
 for(let i=0;i<4;i++)$('s'+i).className=i==view?'on':''}
function calc(){
 const r=S.t.map((n,i)=>({i,n,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
 S.fx.forEach(m=>{if(m.h==null||m.a==null)return;
  if(m.type=='L'&&!S.cl)return;
  const A=r[m.x],B=r[m.y];A.p++;B.p++;A.gf+=m.h;A.ga+=m.a;B.gf+=m.a;B.ga+=m.h;
  if(m.h>m.a){A.w++;B.l++;A.pts+=S.w;B.pts+=S.l}
  else if(m.h<m.a){B.w++;A.l++;B.pts+=S.w;A.pts+=S.l}
  else{A.d++;B.d++;A.pts+=S.d;B.pts+=S.d}});
 return r}
function tables(){
 const r=calc();
 $('tabs').innerHTML=[0,1].map(g=>{
  const rows=r.filter(x=>grp(x.i)==g).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
  return `<div class="card"><h2>${G[g]}</h2><div class="sc"><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>`+
  rows.map((x,k)=>`<tr class="${k<1?'top':''}"><td>${k+1}</td><td>${esc(x.n)}</td><td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf}</td><td>${x.ga}</td><td>${x.gf-x.ga}</td><td class="pts">${x.pts}</td></tr>`).join('')+`</table></div></div>`}).join('')+
  `<div class="mu" style="margin:0 14px">Ranking: points, goal difference, goals for.</div>`}
function fixtures(){
 if(!S.fx.length){$('fx').innerHTML='<div class="mu">No fixtures yet. Go to Setup and tap Generate fixtures.</div>';return}
 $('fx').innerHTML=S.fx.map((m,k)=>`<div class="fx"><span class="n">${k+1}</span>
 <span class="t">${esc(S.t[m.x])}</span>
 <input type="number" inputmode="numeric" min="0" value="${m.h??''}" onchange="setS(${k},'h',this.value)">
 <input type="number" inputmode="numeric" min="0" value="${m.a??''}" onchange="setS(${k},'a',this.value)">
 <span class="t r">${esc(S.t[m.y])}${m.type=='L'?'<span class="tag">LOTTERY</span>':''}</span>
 <span class="mv"><button onclick="mv(${k},-1)">▲</button><button onclick="mv(${k},1)">▼</button></span></div>`).join('')}
function setS(k,f,v){S.fx[k][f]=v===''?null:Math.max(0,parseInt(v)||0);save();draw()}
function mv(k,d){const j=k+d;if(j<0||j>=S.fx.length)return;[S.fx[k],S.fx[j]]=[S.fx[j],S.fx[k]];save();draw()}
function scorers(){
 $('st').innerHTML=S.t.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('');
 const l=S.sc.map((p,i)=>({...p,i})).sort((a,b)=>b.g-a.g);
 $('sc').innerHTML=l.length?`<table><tr><th>#</th><th>Player</th><th>Team</th><th>Goals</th><th></th></tr>`+l.map((p,k)=>`<tr><td>${k+1}</td><td>${esc(p.n)}</td><td>${esc(S.t[p.t])}</td><td class="pts">${p.g}</td>
 <td style="white-space:nowrap"><button class="b g pm" onclick="g(${p.i},-1)">−</button> <button class="b pm" onclick="g(${p.i},1)">+</button> <button class="b g pm" onclick="del(${p.i})">✕</button></td></tr>`).join('')+'</table>':'<div class="mu">No scorers yet.</div>'}
function addSc(){const n=$('sn').value.trim();if(!n)return;S.sc.push({n,t:+$('st').value,g:1});$('sn').value='';save();draw()}
function g(i,d){S.sc[i].g=Math.max(0,S.sc[i].g+d);save();draw()}
function del(i){S.sc.splice(i,1);save();draw()}
function setup(){
 $('teams').innerHTML=[0,1].map(g=>`<div class="mu">${G[g]}</div>`+S.t.map((n,i)=>grp(i)==g?`<div class="row"><input type="text" value="${esc(n)}" onchange="S.t[${i}]=this.value||S.t[${i}];save();draw()"></div>`:'').join('')).join('');
 $('lot').innerHTML=S.lot.map((b,i)=>`<div class="row"><span style="width:38%">${esc(S.t[i])}</span><span>vs</span><select onchange="S.lot[${i}]=+this.value;save()">${[3,4,5].map(j=>`<option value="${j}" ${j==b?'selected':''}>${esc(S.t[j])}</option>`).join('')}</select></div>`).join('');
 $('cl').checked=S.cl;$('pw').value=S.w;$('pd').value=S.d;$('pl').value=S.l}
['pw','pd','pl'].forEach(id=>$(id).onchange=()=>{S.w=+$('pw').value||0;S.d=+$('pd').value||0;S.l=+$('pl').value||0;save()});
function shuf(){const a=[3,4,5];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}S.lot=a;save();draw()}
function gen(){
 if(S.fx.some(m=>m.h!=null)&&!confirm('This clears all scores. Continue?'))return;
 const p=[[0,1],[0,2],[1,2]],f=[];
 for(let k=0;k<3;k++){f.push({x:p[k][0],y:p[k][1],type:'G'});f.push({x:p[k][0]+3,y:p[k][1]+3,type:'G'})}
 S.lot.forEach((b,i)=>f.push({x:i,y:b,type:'L'}));
 S.fx=f.map(m=>({...m,h:null,a:null}));save();view=1;draw()}
function rst(){if(confirm('Delete all teams, fixtures and scorers?')){S=def();save();draw()}}
function draw(){nav();tables();fixtures();scorers();setup();window.scrollTo(0,0)}
draw();
</script></body></html>
